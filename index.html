<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2a900">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Timesheet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#1b2530;--mute:#657281;--line:#d9dee4;--acc:#f2a900;--accink:#1b2530;--go:#1f8f5f;--stop:#c93b3b}
@media(prefers-color-scheme:dark){:root{--bg:#11161c;--card:#1a222b;--ink:#e8edf2;--mute:#8d9aa8;--line:#2a3541;--acc:#f2b51f;--accink:#11161c;--go:#35b97f;--stop:#e4605f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#main{flex:1;overflow-y:auto;padding:14px 14px 90px;max-width:640px;width:100%;margin:0 auto}
h2{font-size:22px;margin:4px 0 12px}
h3{margin:0 0 10px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.center{text-align:center}
.muted{color:var(--mute);font-size:14px}
.clock{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:6px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
input,select,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:4px 0 10px}
label{display:block;font-size:14px;color:var(--mute)}
button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;cursor:pointer}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.danger{color:var(--stop)}
button.big{width:100%;padding:18px;font-size:20px;font-weight:700;border:0;color:#fff;border-radius:14px}
button.go{background:var(--go)}button.stop{background:var(--stop)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.right{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayh{display:flex;justify-content:space-between;font-weight:600;margin:14px 2px 6px}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:9px;color:var(--mute)}
.bars i{display:block;width:100%;background:var(--acc);border-radius:3px 3px 0 0;min-height:1px}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;border-radius:0;background:none;font-size:12px;color:var(--mute);padding:9px 0}
#nav button span{display:block;font-size:20px}
#nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px var(--acc)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#modal.open{display:flex}
#sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--accink);font-size:30px;border:0;padding:0;box-shadow:0 3px 10px rgba(0,0,0,.3)}

.cmh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cw{display:grid;grid-template-columns:repeat(7,1fr) 58px;gap:3px;margin-bottom:3px}
.chd{font-size:12px;color:var(--mute);text-align:center}
.cd{min-height:56px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;overflow:hidden}
.cd span{font-size:10px;color:var(--mute);align-self:flex-start;padding-left:3px}
.cd b{font-size:12px;font-variant-numeric:tabular-nums}
.cd u{display:flex;gap:2px;min-height:6px;text-decoration:none}
.cd i{width:6px;height:6px;border-radius:50%}
.cd.out{opacity:.45}
.cd.today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.wt{background:var(--acc);color:var(--accink);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.wt b{font-size:14px}.wt span{font-size:11px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:12px;margin:2px 4px 0 0;color:var(--mute)}
#nav button{font-size:11px}textarea{font:inherit;resize:vertical}
button:disabled{opacity:.4}
.phs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}.ph{position:relative;width:76px;height:76px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:8px}.ph button{position:absolute;top:2px;right:2px;padding:0 6px;border-radius:99px;font-size:12px}
.st{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;color:#fff}
.right .st{display:table;margin:3px 0 0 auto}
.st.paid{background:var(--go)}.st.draft{background:#e08a00}.st.sent{background:var(--stop)}
.item.paid{box-shadow:inset 4px 0 var(--go);padding-left:10px}.item.draft{box-shadow:inset 4px 0 #e08a00;padding-left:10px}.item.sent{box-shadow:inset 4px 0 var(--stop);padding-left:10px}
button.big.brk{background:var(--acc);color:var(--accink)}
a.btn{display:block;text-align:center;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;margin-bottom:8px}
a.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
#toast{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;z-index:9;display:none}
</style>
</head>
<body>
<div id="main"></div>
<div id="modal"><div id="sheet"></div></div>
<nav id="nav"></nav>
<script>
const VER='1.8';
const KEY='timesheet_v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function def(){return{jobs:[{id:uid(),name:'General',rate:0,color:'#f2a900',clientId:null}],clients:[],entries:[],running:null,lastJob:null,invoices:[],biz:{name:'',info:'',pay:'',prefix:'INV-',next:1,terms:14,tax:0},
 settings:{round:0,otDaily:0,otWeekly:0,otMult:1.5,weekStart:1,cur:'$',period:'weekly',anchor:'2024-01-01'}}}
// Data saved before v1.8 kept client name/email/address on each project ("job").
// Turn those into real clients (merging same-named ones) and link invoices to them by name.
function migrate(D){
 if(!Array.isArray(D.clients))D.clients=[];
 const find=n=>D.clients.find(c=>c.name.toLowerCase()===n.toLowerCase());
 D.jobs.forEach(j=>{if(j.clientId!==undefined)return;const n=(j.client||'').trim();j.clientId=null;
  if(n){let c=find(n);if(!c){c={id:uid(),name:n,email:'',phone:'',addr:'',notes:''};D.clients.push(c)}
   if(!c.email&&j.email)c.email=j.email;if(!c.addr&&j.addr)c.addr=j.addr;j.clientId=c.id}
  delete j.client;delete j.email;delete j.addr});
 D.invoices.forEach(i=>{if(i.clientId!==undefined)return;const c=i.client&&find(i.client.trim());i.clientId=c?c.id:null});
 return D}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.jobs&&d.entries){const b=def();return migrate(Object.assign(b,d,{settings:Object.assign(b.settings,d.settings)}))}}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),selC=null,tab='timer',off=0,cOff=0,IV=null,EP=[],curE=null,F={job:'',cl:'',tag:'',from:'',to:'',q:'',st:'all'};

/* ---------- helpers ---------- */
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const toLocal=ms=>{const d=new Date(ms);return dayKey(ms)+'T'+p2(d.getHours())+':'+p2(d.getMinutes())};
const tStr=ms=>new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dStr=ms=>new Date(ms).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
const hm=m=>{m=Math.round(m);return Math.floor(m/60)+':'+p2(m%60)};
const hms=ms=>{const s=Math.floor(ms/1000);return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)};
const money=v=>S.settings.cur+v.toFixed(2);
const jobOf=id=>S.jobs.find(j=>j.id===id);
const cliOf=id=>id?S.clients.find(c=>c.id===id):null;
const cliOfE=e=>{const j=jobOf(e.jobId);return j?cliOf(j.clientId):null};
function wkStart(ms){const d=new Date(ms);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()-S.settings.weekStart+7)%7));return d}

/* ---------- calculations ---------- */
function mins(e){let m=(e.end-e.start)/60000-(e.brk||0);const r=S.settings.round;if(r>0)m=Math.round(m/r)*r;return Math.max(0,m)}
// Splits every entry into regular/overtime minutes using daily + weekly rules, and prices it.
function calc(list){
 const st=S.settings,dl=st.otDaily*60,wl=st.otWeekly*60,out={},day={},wk={};
 [...list].sort((a,b)=>a.start-b.start).forEach(e=>{
  const m=mins(e),dk=dayKey(e.start),wk0=+wkStart(e.start);
  let r=m,o=0;
  if(dl>0){r=Math.min(m,Math.max(0,dl-(day[dk]||0)));o=m-r}
  day[dk]=(day[dk]||0)+m;
  if(wl>0){const r2=Math.min(r,Math.max(0,wl-(wk[wk0]||0)));o+=r-r2;r=r2}
  wk[wk0]=(wk[wk0]||0)+r;
  const j=jobOf(e.jobId),rate=j?j.rate:0;
  out[e.id]={m,r,o,pay:r/60*rate+o/60*rate*st.otMult};
 });return out}
function sum(list,C){return list.reduce((t,e)=>{const c=C[e.id];t.m+=c.m;t.r+=c.r;t.o+=c.o;t.pay+=c.pay;return t},{m:0,r:0,o:0,pay:0})}

function range(o){
 const st=S.settings,now=new Date();now.setHours(0,0,0,0);let a,b;
 if(st.period==='weekly'){a=wkStart(Date.now());a.setDate(a.getDate()+7*o);b=new Date(a);b.setDate(b.getDate()+7)}
 else if(st.period==='biweekly'){const an=new Date(st.anchor+'T00:00');an.setHours(0,0,0,0);
  const k=Math.floor(Math.round((now-an)/864e5)/14)+o;a=new Date(an);a.setDate(a.getDate()+14*k);b=new Date(a);b.setDate(b.getDate()+14)}
 else if(st.period==='semimonthly'){const i=now.getMonth()*2+(now.getDate()>15?1:0)+o,mm=Math.floor(i/2),h=((i%2)+2)%2;
  a=new Date(now.getFullYear(),mm,h?16:1);b=h?new Date(now.getFullYear(),mm+1,1):new Date(now.getFullYear(),mm,16)}
 else{a=new Date(now.getFullYear(),now.getMonth()+o,1);b=new Date(now.getFullYear(),now.getMonth()+o+1,1)}
 return[a.getTime(),b.getTime()]}
const rLabel=r=>{const f=x=>new Date(x).toLocaleDateString([],{month:'short',day:'numeric'});return f(r[0])+' – '+f(r[1]-864e5)};

/* ---------- views ---------- */
const TABS=[['timer','Timer','⏱'],['cal','Calendar','📅'],['log','Log','☰'],['inv','Invoices','🧾'],['cli','Clients','👥'],['sum','Summary','📊'],['set','Settings','⚙']];
function render(){
 $('#nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-v="${t[0]}" class="${tab===t[0]?'on':''}"><span>${t[2]}</span>${t[1]}</button>`).join('');
 $('#main').innerHTML=({timer:vTimer,cal:vCal,log:vLog,inv:vInv,cli:vCli,sum:vSum,set:vSet})[tab]();
}
const jobOpts=sel=>S.jobs.map(j=>{const c=cliOf(j.clientId);return`<option value="${j.id}" ${j.id===sel?'selected':''}>${esc(j.name)}${c?' · '+esc(c.name):''}</option>`}).join('');
const cliOpts=sel=>[...S.clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');

const workMs=r=>(r.brkStart||Date.now())-r.start-r.brkMs;
function vTimer(){
 const r=S.running,j=r&&jobOf(r.jobId),C=calc(S.entries),t0=new Date();t0.setHours(0,0,0,0);
 const td=sum(S.entries.filter(e=>e.start>=+t0),C),wk=sum(S.entries.filter(e=>e.start>=+wkStart(Date.now())),C);
 return`<h2>Timesheet</h2>
 <div class="card center"><div class="clock" id="clock">${r?hms(workMs(r)):'00:00:00'}</div>
 ${r?`<div class="muted" style="margin-bottom:10px"><span class="dot" style="background:${j?j.color:'#999'}"></span>${esc(j?j.name:'')}, started ${tStr(r.start)}${r.brkStart?' · on break since '+tStr(r.brkStart):r.brkMs?' · '+Math.round(r.brkMs/60000)+'m break so far':''}</div>`
 :`<select id="tj">${jobOpts(S.lastJob)}</select>`}
 
 ${r?`<button class="big brk" data-a="brk" style="margin-bottom:10px">${r.brkStart?'Resume work':'Take a break'}</button><button class="big stop" data-a="stop">Stop</button>`:`<button class="big go" data-a="start">Start</button>`}</div>
 <div class="stats"><div class="card stat"><span class="muted">Today</span><b>${hm(td.m)}</b><span class="muted">${money(td.pay)}</span></div>
 <div class="card stat"><span class="muted">This week</span><b>${hm(wk.m)}</b><span class="muted">${money(wk.pay)}</span></div></div>`}

function vCal(){
 const C=calc(S.entries),now=new Date(),ref=new Date(now.getFullYear(),now.getMonth()+cOff,1);
 const mo=ref.getMonth(),last=new Date(ref.getFullYear(),mo+1,0),today=dayKey(Date.now());
 const byDay={};S.entries.forEach(e=>(byDay[dayKey(e.start)]=byDay[dayKey(e.start)]||[]).push(e));
 const wd=[0,1,2,3,4,5,6].map(i=>['S','M','T','W','T','F','S'][(S.settings.weekStart+i)%7]);
 const mR=v=>S.settings.cur+Math.round(v);
 let rows='',d=wkStart(+ref),mt={m:0,pay:0};
 while(d<=last){
  let cells='';const wm=[];
  for(let i=0;i<7;i++){
   const k=dayKey(+d),L=byDay[k]||[],t=sum(L,C),inM=d.getMonth()===mo;
   wm.push(...L);
   if(inM){mt.m+=t.m;mt.pay+=t.pay}
   const dots=[...new Set(L.map(e=>e.jobId))].slice(0,4).map(id=>`<i style="background:${jobOf(id)?jobOf(id).color:'#999'}"></i>`).join('');
   cells+=`<div class="cd ${inM?'':'out'} ${k===today?'today':''}" data-a="day" data-v="${k}"><span>${d.getDate()}</span><b>${t.m?hm(t.m):''}</b><u>${dots}</u></div>`;
   d.setDate(d.getDate()+1);
  }
  const w=sum(wm,C);
  rows+=`<div class="cw">${cells}<div class="wt"><b>${w.m?hm(w.m):'–'}</b><span>${w.m?mR(w.pay):''}</span></div></div>`;
 }
 return`<h2>Calendar</h2>
 <div class="cmh"><button data-a="calPrev">‹</button><b>${ref.toLocaleDateString([],{month:'long',year:'numeric'})}</b><button data-a="calNext">›</button></div>
 <div class="cw">${wd.map(x=>`<div class="chd">${x}</div>`).join('')}<div class="chd">Week</div></div>${rows}
 <div class="stats" style="margin-top:12px"><div class="card stat"><span class="muted">Month hours</span><b>${hm(mt.m)}</b></div><div class="card stat"><span class="muted">Month earnings</span><b>${money(mt.pay)}</b></div></div>
 ${cOff?'<button style="width:100%" data-a="calNow">Back to this month</button>':''}
 <p class="muted center">Tap a day to see or add entries. Week totals include days from neighboring months.</p>`}

const parseTags=x=>[...new Set(String(x).split(/[,\s]+/).map(t=>t.replace(/^#/,'').toLowerCase()).filter(Boolean))];
const allTags=()=>[...new Set(S.entries.flatMap(e=>e.tags||[]))].sort();
const tagChips=t=>allTags().map(x=>`<span class="tag" data-a="addTag" data-v="${esc(x)}" data-t="${t}">#${esc(x)}</span>`).join('');
function filt(){const q=F.q.toLowerCase();return S.entries.filter(e=>{const j=jobOf(e.jobId),k=dayKey(e.start);
 const c=cliOfE(e);
 return(!F.job||e.jobId===F.job)&&(!F.cl||(F.cl==='none'?!c:!!c&&c.id===F.cl))&&(!F.tag||(e.tags||[]).includes(F.tag))&&(!F.from||k>=F.from)&&(!F.to||k<=F.to)&&(F.st==='all'||(F.st==='open')===!e.inv)&&
 (!q||((e.note||'')+' '+(j?j.name:'')+' '+(c?c.name:'')+' '+(e.tags||[]).join(' ')).toLowerCase().includes(q))}).sort((a,b)=>b.start-a.start)}
function resHtml(){const L=filt(),C=calc(S.entries),t=sum(L,C),days={};
 L.forEach(e=>(days[dayKey(e.start)]=days[dayKey(e.start)]||[]).push(e));
 return`<div class="stats"><div class="card stat"><span class="muted">${L.length} entries</span><b>${hm(t.m)}</b></div><div class="card stat"><span class="muted">Earnings</span><b>${money(t.pay)}</b></div></div>
 <div class="row" style="margin-bottom:6px"><button class="pri" data-a="mkInv" ${L.length?'':'disabled'}>Create invoice</button><button data-a="csvF" ${L.length?'':'disabled'}>Export CSV</button></div>`+
 (Object.keys(days).map(k=>{const D=days[k],d=sum(D,C);return`<div class="dayh"><span>${dStr(D[0].start)}</span><span>${hm(d.m)} · ${money(d.pay)}</span></div><div class="card" style="padding:4px 14px">`+
  D.map(e=>{const j=jobOf(e.jobId),c=C[e.id];
   return`<div class="item" data-a="editE" data-v="${e.id}"><div><span class="dot" style="background:${j?j.color:'#999'}"></span>${esc(j?j.name:'Deleted project')}<div class="muted">${tStr(e.start)} to ${tStr(e.end)}${e.brk?`, ${e.brk}m break`:''}${e.note?`<br>${esc(e.note)}`:''}</div>${(e.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}${(e.photos||[]).length?`<span class="tag">📷 ${e.photos.length}</span>`:''}${e.inv?'<span class="tag">invoiced</span>':''}</div>
   <div class="right">${hm(c.m)}<div class="muted">${c.o?hm(c.o)+' OT':money(c.pay)}</div></div></div>`}).join('')+`</div>`}).join('')||'<div class="card muted center">No matching entries.</div>')}
function vLog(){
 return`<h2>Log</h2><div class="card"><input data-f="q" placeholder="Search notes, clients, tags" value="${esc(F.q)}">
 <div class="row"><select data-f="cl"><option value="">All clients</option>${cliOpts(F.cl)}<option value="none" ${F.cl==='none'?'selected':''}>No client</option></select><select data-f="job"><option value="">All projects</option>${jobOpts(F.job)}</select></div><div class="row"><select data-f="tag"><option value="">All tags</option>${allTags().map(t=>`<option ${t===F.tag?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
 <div class="row"><input type="date" data-f="from" value="${F.from}"><input type="date" data-f="to" value="${F.to}"></div>
 <div class="row" style="margin-top:0"><select data-f="st">${[['all','All entries'],['open','Not invoiced'],['billed','Invoiced']].map(x=>`<option value="${x[0]}" ${F.st===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><button data-a="clrF">Clear filters</button></div></div>
 <div id="res">${resHtml()}</div><button class="fab" data-a="addE">+</button>`}

/* ---------- invoices ---------- */
const tot=iv=>{const s=iv.items.reduce((a,i)=>a+i.q*i.r,0),t=s*iv.tax/100;return{s,t,g:s+t}};
const ST={draft:'Draft',sent:'Sent, unpaid',paid:'Paid'};

function parseCSV(t){const R=[];let r=[],f='',q=false;

  else if(c=='"')q=true;else if(c==','){r.push(f);f=''}
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))R.push(r);r=[]}else f+=c}

function parseDate(s){s=(s||'').trim();let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]);
 m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);if(m){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;return a>12?new Date(y,b-1,a):new Date(y,a-1,b)}
 const t=Date.parse(s);if(t){const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate())}return null}
const parseTm=s=>{const m=(s||'').match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap])?\.?m?/i);if(!m)return null;let h=+m[1];const a=m[3]&&m[3].toLowerCase();if(a==='p'&&h<12)h+=12;if(a==='a'&&h===12)h=0;return h*60+ +m[2]};
const parseDur=s=>{s=(s||'').trim();if(!s)return null;if(s.includes(':')){const x=s.split(':');return +x[0]*60+(+x[1]||0)}const v=parseFloat(s);return isNaN(v)?null:v*60};
function rowToEntry(r,M){
 const g=k=>M[k]>=0?(r[M[k]]||'').trim():'';
 const ds=g('date')||g('start'),d=parseDate(ds);if(!d)return null;
 const em=parseTm(g('end')),dm=parseDur(g('dur')),brk=g('brk').includes(':')?parseDur(g('brk')):(parseFloat(g('brk'))||0);
 let sm=parseTm(g('start'));if(sm==null)sm=parseTm(ds);if(sm==null)sm=(em==null&&dm!=null)?540:0;
 const start=+d+sm*60000;let end;
 if(em!=null){end=+d+em*60000;if(end<=start)end+=864e5}
 else if(dm!=null)end=start+(dm+brk)*60000;else return null;
 if(end<=start)return null;

 const e=id?S.entries.find(x=>x.id===id):{jobId:S.lastJob||S.jobs[0].id,start:day?new Date(day+'T09:00').getTime():Date.now()-36e5,end:day?new Date(day+'T17:00').getTime():Date.now(),brk:0,note:''};
 openM(`<h3>${fin?'Nice work. Add the details':id?'Edit entry':'Add entry'}</h3>
 <label>Project<select id="mj">${jobOpts(e.jobId)}</select></label>
 <label>Start<input type="datetime-local" id="ms" value="${toLocal(e.start)}"></label>
 <label>End<input type="datetime-local" id="me" value="${toLocal(e.end)}"></label>
 <label>Break (minutes)<input type="number" min="0" id="mb" value="${e.brk||0}"></label>
 <label>Note<input id="mn" value="${esc(e.note)}"></label><label>Tags<input id="mt" value="${esc((e.tags||[]).join(', '))}"></label><div style="margin-bottom:10px">${tagChips('mt')}</div><label>Photos of work done<input type="file" id="pf" accept="image/*" multiple></label><div class="phs" id="ph"></div>
 <div class="row"><button data-a="close">Cancel</button>${id?`<button class="danger" data-a="delE" data-v="${id}">Delete</button>`:''}<button class="pri" data-a="saveE" data-v="${id||''}">Save</button></div>`)}

function dayM(k){
 const C=calc(S.entries),L=S.entries.filter(e=>dayKey(e.start)===k).sort((a,b)=>a.start-b.start),t=sum(L,C);
 openM(`<h3>${dStr(new Date(k+'T00:00').getTime())}</h3>
 <div class="muted" style="margin-bottom:8px">${hm(t.m)} hours, ${money(t.pay)}</div>
 ${L.length?L.map(e=>{const j=jobOf(e.jobId),c=C[e.id];return`<div class="item" data-a="editE" data-v="${e.id}"><div><span class="dot" style="background:${j?j.color:'#999'}"></span>${esc(j?j.name:'Deleted project')}<div class="muted">${tStr(e.start)} to ${tStr(e.end)}${e.note?`<br>${esc(e.note)}`:''}</div></div><div class="right">${hm(c.m)}<div class="muted">${money(c.pay)}</div></div></div>`}).join(''):'<div class="muted">No entries on this day.</div>'}
 <div class="row" style="margin-top:14px"><button data-a="close">Close</button><button class="pri" data-a="addD" data-v="${k}">Add entry</button></div>`)}

function jobM(id,cid){
 const j=id?jobOf(id):{name:'',rate:0,color:'#f2a900',clientId:cid||null};
 openM(`<h3>${id?'Edit project':'Add project'}</h3>
 <label>Name<input id="jn" value="${esc(j.name)}"></label>
 <label>Client<select id="jl"><option value="">No client</option>${cliOpts(j.clientId)}</select></label>${S.clients.length?'':'<div class="muted" style="margin:-6px 0 10px">Add clients in the Clients tab.</div>'}
 <label>Hourly rate<input type="number" min="0" step="0.01" id="jr" value="${j.rate}"></label>
 <label>Color<input type="color" id="jc" value="${j.color}"></label>
 <div class="row"><button data-a="close">Cancel</button>${id?`<button class="danger" data-a="delJ" data-v="${id}">Delete</button>`:''}<button class="pri" data-a="saveJ" data-v="${id||''}">Save</button></div>`)}

function cliM(id){const c=id?cliOf(id):{name:'',email:'',phone:'',addr:'',notes:''};
 openM(`<h3>${id?'Edit client':'Add client'}</h3>
 <label>Name<input id="cn" value="${esc(c.name)}"></label>
 <label>Email<input id="ce" type="email" value="${esc(c.email)}"></label>
 <label>Phone<input id="cp" type="tel" value="${esc(c.phone)}"></label>
 <label>Address<textarea id="ca" rows="2">${esc(c.addr)}</textarea></label>
 <label>Notes<textarea id="co" rows="2">${esc(c.notes)}</textarea></label>
 <div class="row"><button data-a="close">Cancel</button>${id?`<button class="danger" data-a="delC" data-v="${id}">Delete</button>`:''}<button class="pri" data-a="saveC" data-v="${id||''}">Save</button></div>`)}

/* ---------- clients ---------- */
function newCli(n){const c={id:uid(),name:n,email:'',phone:'',addr:'',notes:''};S.clients.push(c);return c}
// Money picture for one client, or (id null) for projects that have no client.
function cliStats(id){
 const C=calc(S.entries),js=S.jobs.filter(j=>(j.clientId||null)===id),ids=new Set(js.map(j=>j.id)),E=S.entries.filter(e=>ids.has(e.jobId));
 const inv=S.invoices.filter(i=>(i.clientId||null)===id),by=st=>inv.filter(i=>i.status===st).reduce((a,i)=>a+tot(i).g,0),today=dayKey(Date.now());
 return{C,js,E,inv,all:sum(E,C),open:sum(E.filter(e=>!e.inv),C),paid:by('paid'),sent:by('sent'),draft:by('draft'),od:inv.filter(i=>i.status==='sent'&&i.due&&i.due<today).length}}
function vCli(){
 if(selC)return vCliOne();
 const rows=[...S.clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>({id:c.id,n:c.name,s:cliStats(c.id)})),nc=cliStats(null);
 if(nc.E.length||nc.inv.length)rows.push({id:'none',n:'Projects without a client',s:nc});
 const T=rows.reduce((a,r)=>({paid:a.paid+r.s.paid,sent:a.sent+r.s.sent,open:a.open+r.s.open.pay}),{paid:0,sent:0,open:0});
 return`<h2>Clients</h2>
 <div class="stats"><div class="card stat"><span class="muted">Paid</span><b style="color:var(--go)">${money(T.paid)}</b></div><div class="card stat"><span class="muted">Sent, unpaid</span><b style="color:var(--stop)">${money(T.sent)}</b></div></div>
 <div class="card stat"><span class="muted">Worked, not invoiced yet</span><b>${money(T.open)}</b></div>
 ${rows.length?`<div class="card" style="padding:4px 14px">${rows.map(r=>`<div class="item" data-a="cli" data-v="${r.id}"><div>${esc(r.n)}<div class="muted">${r.s.js.length} project${r.s.js.length===1?'':'s'} · ${hm(r.s.all.m)} h</div></div><div class="right">${r.s.sent?`<span style="color:var(--stop)">${money(r.s.sent)} unpaid</span>`:''}<div class="muted">${money(r.s.paid)} paid</div></div></div>`).join('')}</div>`
 :'<div class="card muted center">No clients yet. Tap + to add one, then add their projects.</div>'}
 <button class="fab" data-a="addC">+</button>`}
function vCliOne(){
 const c=selC==='none'?null:cliOf(selC);if(selC!=='none'&&!c){selC=null;return vCli()}
 const s=cliStats(c?c.id:null),inv=[...s.inv].sort((a,b)=>b.date.localeCompare(a.date));
 const pj=s.js.map(j=>{const E=s.E.filter(e=>e.jobId===j.id);return{j,t:sum(E,s.C),o:sum(E.filter(e=>!e.inv),s.C)}});
 return`<div class="between"><button data-a="cliBack">‹ Clients</button>${c?`<button data-a="editC" data-v="${c.id}">Edit client</button>`:''}</div>
 <h2 style="margin-top:12px">${esc(c?c.name:'Projects without a client')}</h2>
 ${c&&(c.email||c.phone||c.addr||c.notes)?`<div class="muted" style="margin:-6px 0 12px">${[c.email,c.phone,c.addr,c.notes].filter(Boolean).map(esc).join('<br>')}</div>`:''}
 <div class="stats">
  <div class="card stat"><span class="muted">Paid</span><b style="color:var(--go)">${money(s.paid)}</b></div>
  <div class="card stat"><span class="muted">Sent, unpaid</span><b style="color:var(--stop)">${money(s.sent)}</b>${s.od?`<span class="muted">${s.od} overdue</span>`:''}</div>
  <div class="card stat"><span class="muted">Drafts</span><b>${money(s.draft)}</b></div>
  <div class="card stat"><span class="muted">Not invoiced yet</span><b>${money(s.open.pay)}</b><span class="muted">${hm(s.open.m)} h</span></div></div>
 <div class="card"><div class="between" style="margin-bottom:4px"><b>Projects</b>${c?`<button data-a="addJc" data-v="${c.id}">Add project</button>`:''}</div>
 ${pj.length?pj.map(x=>`<div class="item" data-a="editJ" data-v="${x.j.id}"><div><span class="dot" style="background:${x.j.color}"></span>${esc(x.j.name)}<div class="muted">${money(x.j.rate)}/h · ${hm(x.t.m)} h</div></div><div class="right">${money(x.t.pay)}<div class="muted">${x.o.m?money(x.o.pay)+' not invoiced':x.t.m?'all invoiced':''}</div></div></div>`).join(''):'<div class="muted">No projects yet.</div>'}</div>
 <div class="card" style="padding:14px 14px 4px"><b>Invoices</b>${inv.length?inv.map(invRow).join(''):'<div class="muted" style="padding-bottom:10px">No invoices yet.</div>'}</div>
 ${s.open.m?`<button class="pri" style="width:100%" data-a="cliLog">See uninvoiced work in the Log</button>`:''}`}

/* ---------- export ---------- */
function csv(list){
 const C=calc(S.entries),rows=[['Date','Client','Project','Start','End','Break (min)','Hours','Regular hours','Overtime hours','Earnings','Note']];
 [...list].sort((a,b)=>a.start-b.start).forEach(e=>{const c=C[e.id],j=jobOf(e.jobId);
  const cl=cliOfE(e);rows.push([dayKey(e.start),cl?cl.name:'',j?j.name:'',tStr(e.start),tStr(e.end),e.brk||0,(c.m/60).toFixed(2),(c.r/60).toFixed(2),(c.o/60).toFixed(2),c.pay.toFixed(2),e.note||''])});
 return rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')}
// Installed (home screen) apps on some phones can't save files from script, so there the user taps a real link instead.
const SA=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let FU=null,FM=null;
function fileM(name,blob,o={}){
 if(FU)URL.revokeObjectURL(FU);FU=URL.createObjectURL(blob);
 const f=new File([blob],name,{type:blob.type}),sh=!!(navigator.canShare&&navigator.canShare({files:[f]}));FM={f,title:o.title||name,txt:o.txt||''};
 openM(`<h3>${esc(o.head||'File ready')}</h3><div class="muted" style="margin-bottom:12px">${esc(name)}</div>
 ${sh?'<button class="pri" data-a="fShare" style="width:100%;margin-bottom:8px">Share…</button>':''}
 <a class="btn ${sh?'':'pri'}" href="${FU}" download="${esc(name)}">Save to device</a>
 ${o.mail?`<a class="btn" href="${esc(o.mail)}">Open email app</a><div class="muted" style="margin-bottom:8px">Email apps can't pick up the file by themselves. Save it first, then attach it to the email.</div>`:''}
 ${SA()&&o.open?`<a class="btn" href="${esc(o.open)}" target="_blank" rel="noopener">Open in browser instead</a><div class="muted">If saving does nothing or shows a blank page, this phone doesn't let installed apps save files. Open in your browser and save from there.</div>`:''}
 <button data-a="${o.back?'fBack':'close'}" style="width:100%;margin-top:8px">${o.back?'Back to invoice':'Close'}</button>`)}
function dl(name,text,type){const b=text instanceof Blob?text:new Blob([text],{type});if(SA()){fileM(name,b,{open:'?tab='+tab});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}

/* ---------- actions ---------- */
const A={
 tab(v){tab=v;selC=null;if(v==='sum')off=0;render()},
 cli(v){selC=v;render();$('#main').scrollTop=0},cliBack(){selC=null;render()},addC(){cliM()},editC(v){cliM(v)},addJc(v){jobM(null,v)},
 cliLog(){F={job:'',cl:selC,tag:'',from:'',to:'',q:'',st:'open'};tab='log';selC=null;render()},
 saveC(v){const d={name:$('#cn').value.trim()||'Untitled client',email:$('#ce').value.trim(),phone:$('#cp').value.trim(),addr:$('#ca').value.trim(),notes:$('#co').value.trim()};
  if(v)Object.assign(cliOf(v),d);else{const c=Object.assign({id:uid()},d);S.clients.push(c);selC=c.id}save();closeM();render()},
 delC(v){ask('Delete this client? Their projects and invoices are kept, just without a client.','Delete',()=>{S.jobs.forEach(j=>{if(j.clientId===v)j.clientId=null});S.invoices.forEach(i=>{if(i.clientId===v)i.clientId=null});S.clients=S.clients.filter(c=>c.id!==v);selC=null;save();render()})},
 start(){const jid=$('#tj').value;S.lastJob=jid;S.running={jobId:jid,start:Date.now(),brkMs:0,brkStart:null};save();render()},
 stop(){const r=S.running,id=uid(),n=Date.now(),bm=r.brkMs+(r.brkStart?n-r.brkStart:0);S.entries.push({id,jobId:r.jobId,start:r.start,end:n,brk:Math.round(bm/60000),note:'',tags:[]});S.running=null;save();render();entryM(id,null,true)},
 addE(){entryM()},askOk(){const f=AK;AK=null;closeM();if(f)f()},brk(){const r=S.running,n=Date.now();if(r.brkStart){r.brkMs+=n-r.brkStart;r.brkStart=null}else r.brkStart=n;save();render()},doImp(){doImport()},rmPh(v){EP=EP.filter(x=>x!==v);pDel(v);syncP();showPh($('#ph'),EP)},addTag(v,el){const i=$('#'+el.dataset.t),c=parseTags(i.value);if(!c.includes(v))c.push(v);i.value=c.join(', ')},
 clrF(){F={job:'',cl:'',tag:'',from:'',to:'',q:'',st:'all'};render()},csvF(){dl('timesheet-filtered.csv',csv(filt()),'text/csv')},mkInv(){mkInv()},
 openI(v){IV=JSON.parse(JSON.stringify(S.invoices.find(i=>i.id===v)));invM()},
 ivAdd(){readIV();IV.items.push({d:'',q:1,r:0});invM()},ivDel(v){readIV();IV.items.splice(+v,1);invM()},
 ivSave(){readIV();commitIV();closeM();render()},
 fShare(){navigator.share({files:[FM.f],title:FM.title,text:FM.txt}).catch(e=>{if(e.name!=='AbortError')say('Sharing failed. Use Save to device instead.')})},
 fBack(){invM()},
 ivDelete(){const id=IV.id;ask('Delete this invoice? Its entries become uninvoiced.','Delete',()=>{S.entries.forEach(e=>{if(e.inv===id)delete e.inv});S.invoices=S.invoices.filter(i=>i.id!==id);save();render()})},
 async ivPdf(){let b;try{say('Making the PDF…');b=await makePdf()}catch(e){say('Could not make the PDF. The PDF tool needs an internet connection the first time.');return}
  const wasNew=IV.isNew;commitIV();render();if(wasNew)say('Invoice saved as '+IV.num+'.');
  const txt='Invoice '+IV.num+' from '+(S.biz.name||'me')+': '+money(tot(IV).g)+', due '+IV.due+'.';
  fileM('Invoice-'+IV.num+'.pdf',b,{head:'Invoice '+IV.num+' is ready',title:'Invoice '+IV.num,txt,back:1,open:'?inv='+IV.id,
   mail:'mailto:'+encodeURI(IV.email||'')+'?subject='+encodeURIComponent('Invoice '+IV.num)+'&body='+encodeURIComponent(txt+'\n\nThe invoice PDF is attached.')})},
 day(v){dayM(v)},addD(v){entryM(null,v)},calPrev(){cOff--;render()},calNext(){cOff++;render()},calNow(){cOff=0;render()},editE(v){entryM(v)},close(){closeM()},
 saveE(v){const s=new Date($('#ms').value).getTime(),e=new Date($('#me').value).getTime();
  if(!s||!e||e<=s){say('End time must be after start time.');return}
  const d={jobId:$('#mj').value,start:s,end:e,brk:Math.max(0,parseInt($('#mb').value)||0),note:$('#mn').value.trim(),tags:parseTags($('#mt').value),photos:[...EP]};
  if(v)Object.assign(S.entries.find(x=>x.id===v),d);else S.entries.push(Object.assign({id:uid()},d));
  S.lastJob=d.jobId;save();closeM();render()},
 delE(v){ask('Delete this entry?','Delete',()=>{S.entries=S.entries.filter(x=>x.id!==v);save();render()})},
 addJ(){jobM()},editJ(v){jobM(v)},
 saveJ(v){const d={name:$('#jn').value.trim()||'Untitled',rate:parseFloat($('#jr').value)||0,color:$('#jc').value,clientId:$('#jl').value||null};
  if(v)Object.assign(jobOf(v),d);else S.jobs.push(Object.assign({id:uid()},d));save();closeM();render()},
 delJ(v){if(S.jobs.length<2){say('Keep at least one project.');return}
  if(S.entries.some(e=>e.jobId===v)){say('This project has entries. Delete or move them first.');return}
  ask('Delete this project?','Delete',()=>{S.jobs=S.jobs.filter(j=>j.id!==v);save();render()})},
 prev(){off--;render()},next(){off++;render()},
 csvP(){const r=range(off);dl('timesheet-'+dayKey(r[0])+'.csv',csv(S.entries.filter(e=>e.start>=r[0]&&e.start<r[1])),'text/csv')},
 csvAll(){dl('timesheet-all.csv',csv(S.entries),'text/csv')},
 bk(){dl('timesheet-backup-'+dayKey(Date.now())+'.json',JSON.stringify(S),'application/json')},
 wipe(){ask('Erase all clients, projects, entries and invoices? This cannot be undone.','Erase everything',()=>{S=def();indexedDB.deleteDatabase('ts_photos');save();render()})}
};
document.addEventListener('click',ev=>{
 if(ev.target.id==='modal'){closeM();return}
 const el=ev.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el.dataset.v,el)});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.id==='rf'&&t.files[0]){const f=new FileReader();f.onload=()=>{try{const d=JSON.parse(f.result);if(!Array.isArray(d.jobs)||!Array.isArray(d.entries))throw 0;
  ask('Replace current data with this backup?','Replace',()=>{localStorage.setItem(KEY,JSON.stringify(d));S=load();render()})}catch(e){say('That file is not a valid Timesheet backup.')}};f.readAsText(t.files[0]);return}
 if(t.id==='pf'){addPhotos(t.files);return}
 if(t.id==='icl'){const c=cliOf(t.value);if(c){$('#ic').value=c.name;$('#ie').value=c.email;$('#ia').value=c.addr}return}
 if(t.dataset.m){IMP.M[t.dataset.m]=parseInt(t.value);$('#ipv').textContent=pv();return}
 if(t.id==='cf'&&t.files[0]){const f=new FileReader();f.onload=()=>{const R=parseCSV(String(f.result).replace(/^\uFEFF/,''));if(R.length<2){say('That file has no data rows.');return}IMP={head:R[0].map(x=>x.trim()),rows:R.slice(1),M:guess(R[0])};impM()};f.readAsText(t.files[0]);t.value='';return}
 if(t.dataset.f){fl(t);return}
 if(t.dataset.b){S.biz[t.dataset.b]=t.type==='number'?(parseFloat(t.value)||0):t.value;save();return}
 const k=t.dataset.s;if(!k)return;
 S.settings[k]=(t.type==='number'||t.dataset.n)?(parseFloat(t.value)||0):t.value;save();render()});
const fl=t=>{F[t.dataset.f]=t.value;const r=$('#res');if(r)r.innerHTML=resHtml()};
document.addEventListener('input',ev=>{if(ev.target.dataset.f)fl(ev.target)});
setInterval(()=>{const c=$('#clock');if(c&&S.running)c.textContent=hms(workMs(S.running))},1000);
// "Open in browser" links land here: ?inv=<id> reopens that invoice, ?tab=<name> picks a tab.
const QP=new URLSearchParams(location.search),qi=QP.get('inv'),qt=QP.get('tab');
if(TABS.some(t=>t[0]===qt))tab=qt;if(qi&&S.invoices.some(i=>i.id===qi))tab='inv';
if(location.search)history.replaceState(null,'',location.pathname);
render();if(tab==='inv'&&qi&&S.invoices.some(i=>i.id===qi))A.openI(qi);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
