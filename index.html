<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2a900">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Timesheet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B1%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#eef1f4;--card:#ffffff;--ink:#1b2530;--mute:#657281;--line:#d9dee4;--acc:#f2a900;--accink:#1b2530;--go:#1f8f5f;--stop:#c93b3b}
/* Dark colors: follow the phone unless Settings forces light or dark (data-theme on <html>) */
:root{color-scheme:light dark}:root[data-theme=light]{color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11161c;--card:#1a222b;--ink:#e8edf2;--mute:#8d9aa8;--line:#2a3541;--acc:#f2b51f;--accink:#11161c;--go:#35b97f;--stop:#e4605f}}
:root[data-theme=dark]{color-scheme:dark;--bg:#11161c;--card:#1a222b;--ink:#e8edf2;--mute:#8d9aa8;--line:#2a3541;--acc:#f2b51f;--accink:#11161c;--go:#35b97f;--stop:#e4605f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#main{flex:1;overflow-y:auto;padding:14px 14px 90px;max-width:640px;width:100%;margin:0 auto}
h2{font-size:22px;margin:4px 0 12px}
h3{margin:0 0 10px;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.center{text-align:center}
.muted{color:var(--mute);font-size:14px}
.clock{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;margin:6px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
input,select,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:4px 0 10px}
label{display:block;font-size:14px;color:var(--mute)}
button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;cursor:pointer}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button.danger{color:var(--stop)}
button.big{width:100%;padding:18px;font-size:20px;font-weight:700;border:0;color:#fff;border-radius:14px}
button.go{background:var(--go)}button.stop{background:var(--stop)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.right{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayh{display:flex;justify-content:space-between;font-weight:600;margin:14px 2px 6px}
.bars{display:flex;align-items:flex-end;gap:2px;height:90px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:9px;color:var(--mute)}
.bars i{display:block;width:100%;background:var(--acc);border-radius:3px 3px 0 0;min-height:1px}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;border:0;border-radius:0;background:none;font-size:12px;color:var(--mute);padding:9px 0}
#nav button span{display:block;font-size:20px}
#nav button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px var(--acc)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
#modal.open{display:flex}
#sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--accink);font-size:30px;border:0;padding:0;box-shadow:0 3px 10px rgba(0,0,0,.3)}

.cmh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.cw{display:grid;grid-template-columns:repeat(7,1fr) 58px;gap:3px;margin-bottom:3px}
.chd{font-size:12px;color:var(--mute);text-align:center}
.cd{min-height:56px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;overflow:hidden}
.cd span{font-size:10px;color:var(--mute);align-self:flex-start;padding-left:3px}
.cd b{font-size:12px;font-variant-numeric:tabular-nums}
.cd u{display:flex;gap:2px;min-height:6px;text-decoration:none}
.cd i{width:6px;height:6px;border-radius:50%}
.cd.out{opacity:.45}
.cd.today span{background:var(--acc);color:var(--accink);font-weight:700;border-radius:99px;padding:0 5px;margin-left:2px}
/* Invoice status of a day: least-finished invoice wins; dashed when some of the day isn't invoiced */
.cd.iv{border-width:2px;border-color:var(--ivc);background:color-mix(in srgb,var(--ivc) 13%,var(--card))}
.cd.iv.paid{--ivc:var(--go)}.cd.iv.sent{--ivc:var(--stop)}.cd.iv.draft{--ivc:#e08a00}.cd.part{border-style:dashed}
.lg{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:10px 0 2px;font-size:12px;color:var(--mute)}
.lg i{display:inline-block;width:14px;height:12px;border-radius:3px;border:2px solid var(--ivc);margin-right:5px;vertical-align:-2px;background:color-mix(in srgb,var(--ivc) 13%,var(--card))}
.lg .paid{--ivc:var(--go)}.lg .sent{--ivc:var(--stop)}.lg .draft{--ivc:#e08a00}.lg .part{--ivc:var(--mute);border-style:dashed}
.wt{background:var(--acc);color:var(--accink);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.wt b{font-size:14px}.wt span{font-size:11px}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:12px;margin:2px 4px 0 0;color:var(--mute)}
#nav button{font-size:11px}textarea{font:inherit;resize:vertical}
button:disabled{opacity:.4}
.phs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}.ph{position:relative;width:76px;height:76px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:8px}.ph button{position:absolute;top:2px;right:2px;padding:0 6px;border-radius:99px;font-size:12px}
.st{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600;color:#fff}
.right .st{display:table;margin:3px 0 0 auto}
.st.paid{background:var(--go)}.st.draft{background:#e08a00}.st.sent{background:var(--stop)}
.item.paid{box-shadow:inset 4px 0 var(--go);padding-left:10px}.item.draft{box-shadow:inset 4px 0 #e08a00;padding-left:10px}.item.sent{box-shadow:inset 4px 0 var(--stop);padding-left:10px}
button.big.brk{background:var(--acc);color:var(--accink)}
a.btn{display:block;text-align:center;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;margin-bottom:8px}
a.btn.pri{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
#toast{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;z-index:9;display:none}
/* polish */
h2{font-size:24px;letter-spacing:-.3px}
.card{box-shadow:0 1px 2px rgba(20,30,45,.05)}
button,a.btn{transition:transform .08s,filter .12s}
button:active,a.btn:active,.cd:active{transform:scale(.97);filter:brightness(.94)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:var(--acc)}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#nav{box-shadow:0 -1px 8px rgba(0,0,0,.06)}
#nav button{padding:8px 0 7px;min-width:0;white-space:nowrap}
#nav button span{font-size:19px;margin-bottom:1px;filter:grayscale(.7);opacity:.7}
#nav button.on span{filter:none;opacity:1}
#modal.open{animation:fade .18s}#modal.open #sheet{animation:up .22s ease-out}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(28px)}}
#sheet::before{content:'';display:block;width:40px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
#toast{max-width:616px;margin:0 auto;box-shadow:0 4px 16px rgba(0,0,0,.3);font-size:15px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600;background:color-mix(in srgb,var(--pc) 15%,var(--card));color:var(--pc)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--pc);animation:pulse 1.6s infinite}
.pill.run{--pc:var(--go)}.pill.brk{--pc:#e08a00}.pill.brk i{animation:none}
@keyframes pulse{50%{opacity:.3}}
.clock.dim{opacity:.45}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0 12px;color:var(--ink);font-size:15px}.chk input{width:auto;margin:0}
.dcs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dc{padding:6px 0;font-size:11px;color:var(--mute);border-radius:8px}.dc b{display:block;font-size:15px;color:var(--ink)}
.dc.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}.dc.on b{color:var(--accink)}
.stats{margin-bottom:12px}.stats .card{margin-bottom:0}
.row>*{min-width:0}input[type=date],input[type=datetime-local]{min-width:0}
input[type=file]{padding:8px;font-size:14px}
input[type=file]::file-selector-button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;margin-right:10px}
#toast{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pkg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.pkd{min-height:50px}.pkd.off{cursor:default;opacity:.45}.pkd.off.iv{opacity:.8}.pkd u{font-size:9px;min-height:11px}
.pkd.on{background:var(--acc);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}.pkd.on span,.pkd.on b{color:var(--accink)}
.lg .pk{border-color:var(--acc);background:var(--acc)}
.paper{background:#fff;color:#1b2530;border:1px solid #d9dee4;border-radius:6px;padding:16px 14px;font-size:12.5px;line-height:1.45;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.12);overflow-wrap:anywhere}
.paper .pt{font-size:22px;font-weight:700;letter-spacing:.5px}.pcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.ptab{width:100%;border-collapse:collapse}.ptab th{text-align:left;font-size:11px;border-top:1px solid #1b2530;border-bottom:1px solid #1b2530;padding:5px 0}
.ptab td{padding:5px 0;vertical-align:top;border-bottom:1px solid #e6e9ed}.ptab th:nth-child(n+2),.ptab td:nth-child(n+2){text-align:right;white-space:nowrap;padding-left:8px}
.ptot{margin:10px 0 0 auto;width:62%}.ptot div{display:flex;justify-content:space-between;padding:2px 0}.ptot .g{font-weight:700;font-size:14px;border-top:1px solid #1b2530;margin-top:4px;padding-top:5px}
.pn{margin-top:14px}.paper .ph{width:64px;height:64px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 2px;font-size:13px;border-radius:9px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--acc);color:var(--accink);font-weight:600}
.dnote{font-size:14px;color:var(--mute);font-style:italic;margin:0 2px 8px;cursor:pointer}
</style>
</head>
<body>
<div id="main"></div>
<div id="modal"><div id="sheet"></div></div>
<nav id="nav"></nav>
<script>
const VER='1.15';
const KEY='timesheet_v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function def(){return{jobs:[{id:uid(),name:'General',rate:0,color:'#f2a900',clientId:null}],clients:[],entries:[],expenses:[],dayNotes:{},running:null,lastJob:null,lastBk:0,invoices:[],biz:{name:'',info:'',pay:'',prefix:'INV-',next:1,terms:14,tax:0},
 settings:{round:0,otDaily:0,otWeekly:0,otMult:1.5,weekStart:1,cur:'$',period:'weekly',anchor:'2024-01-01',geo:1,addr:0,theme:'system',sumV:'period'}}}
// Data saved before v1.8 kept client name/email/address on each project ("job").
// Turn those into real clients (merging same-named ones) and link invoices to them by name.
function migrate(D){
 if(!Array.isArray(D.clients))D.clients=[];if(!D.dayNotes||typeof D.dayNotes!=='object')D.dayNotes={};if(!Array.isArray(D.expenses))D.expenses=[];
 const find=n=>D.clients.find(c=>c.name.toLowerCase()===n.toLowerCase());
 D.jobs.forEach(j=>{if(j.clientId!==undefined)return;const n=(j.client||'').trim();j.clientId=null;
  if(n){let c=find(n);if(!c){c={id:uid(),name:n,email:'',phone:'',addr:'',notes:''};D.clients.push(c)}
   if(!c.email&&j.email)c.email=j.email;if(!c.addr&&j.addr)c.addr=j.addr;j.clientId=c.id}
  delete j.client;delete j.email;delete j.addr});
 D.jobs.forEach(j=>{if(!/^#[0-9a-f]{6}$/i.test(j.color))j.color='#999999'});
 D.invoices.forEach(i=>{if(i.clientId!==undefined)return;const c=i.client&&find(i.client.trim());i.clientId=c?c.id:null});
 return D}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.jobs&&d.entries){const b=def();return migrate(Object.assign(b,d,{settings:Object.assign(b.settings,d.settings)}))}}catch(e){}return def()}
function store(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
// Every save also brings draft invoices back in line with the log; SYN lists the drafts that changed.
let SYN=[];
function save(){try{SYN=syncDrafts()}catch(e){SYN=[]}store()}
const synSay=()=>{if(SYN.length)say('Updated draft invoice'+(SYN.length>1?'s ':' ')+SYN.join(', ')+'.')};
let S=load(),selC=null,setV=null,PQ='',PA=false,tab='timer',off=0,cOff=0,IV=null,EP=[],curE=null,F={job:'',cl:'',tag:'',from:'',to:'',q:'',st:'all'};

/* ---------- helpers ---------- */
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const toLocal=ms=>{const d=new Date(ms);return dayKey(ms)+'T'+p2(d.getHours())+':'+p2(d.getMinutes())};
const tStr=ms=>new Date(ms).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dStr=ms=>new Date(ms).toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'});
const hm=m=>{m=Math.round(m);return Math.floor(m/60)+':'+p2(m%60)};
const hms=ms=>{const s=Math.floor(ms/1000);return p2(Math.floor(s/3600))+':'+p2(Math.floor(s%3600/60))+':'+p2(s%60)};
const money=v=>S.settings.cur+v.toFixed(2);
const jobOf=id=>S.jobs.find(j=>j.id===id);
const cliOf=id=>id?S.clients.find(c=>c.id===id):null;
const cliOfE=e=>{const j=jobOf(e.jobId);return j?cliOf(j.clientId):null};
function wkStart(ms){const d=new Date(ms);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()-S.settings.weekStart+7)%7));return d}

/* ---------- calculations ---------- */
function mins(e){let m=(e.end-e.start)/60000-(e.brk||0);const r=S.settings.round;if(r>0)m=Math.round(m/r)*r;return Math.max(0,m)}
// Splits every entry into regular/overtime minutes using daily + weekly rules, and prices it.
function calc(list){
 const st=S.settings,dl=st.otDaily*60,wl=st.otWeekly*60,out={},day={},wk={};
 [...list].sort((a,b)=>a.start-b.start).forEach(e=>{
  const m=mins(e),dk=dayKey(e.start),wk0=+wkStart(e.start);
  let r=m,o=0;
  if(dl>0){r=Math.min(m,Math.max(0,dl-(day[dk]||0)));o=m-r}
  day[dk]=(day[dk]||0)+m;
  if(wl>0){const r2=Math.min(r,Math.max(0,wl-(wk[wk0]||0)));o+=r-r2;r=r2}
  wk[wk0]=(wk[wk0]||0)+r;
  const j=jobOf(e.jobId),rate=j?j.rate:0;
  out[e.id]={m,r,o,pay:r/60*rate+o/60*rate*st.otMult};
 });return out}
function sum(list,C){return list.reduce((t,e)=>{const c=C[e.id];t.m+=c.m;t.r+=c.r;t.o+=c.o;t.pay+=c.pay;return t},{m:0,r:0,o:0,pay:0})}

function range(o){
 const st=S.settings,now=new Date();now.setHours(0,0,0,0);let a,b;
 if(st.period==='weekly'){a=wkStart(Date.now());a.setDate(a.getDate()+7*o);b=new Date(a);b.setDate(b.getDate()+7)}
 else if(st.period==='biweekly'){const an=new Date(st.anchor+'T00:00');an.setHours(0,0,0,0);
  const k=Math.floor(Math.round((now-an)/864e5)/14)+o;a=new Date(an);a.setDate(a.getDate()+14*k);b=new Date(a);b.setDate(b.getDate()+14)}
 else if(st.period==='semimonthly'){const i=now.getMonth()*2+(now.getDate()>15?1:0)+o,mm=Math.floor(i/2),h=((i%2)+2)%2;
  a=new Date(now.getFullYear(),mm,h?16:1);b=h?new Date(now.getFullYear(),mm+1,1):new Date(now.getFullYear(),mm,16)}
 else{a=new Date(now.getFullYear(),now.getMonth()+o,1);b=new Date(now.getFullYear(),now.getMonth()+o+1,1)}
 return[a.getTime(),b.getTime()]}
// Summary views: the pay period from Settings, a calendar month, a year, or everything.
function sumRange(o){const v=S.settings.sumV||'period',n=new Date();
 if(v==='month')return[+new Date(n.getFullYear(),n.getMonth()+o,1),+new Date(n.getFullYear(),n.getMonth()+o+1,1)];
 if(v==='year')return[+new Date(n.getFullYear()+o,0,1),+new Date(n.getFullYear()+o+1,0,1)];
 if(v==='all'){let a=Infinity,b=-Infinity;S.entries.forEach(e=>{a=Math.min(a,e.start);b=Math.max(b,e.start)});S.expenses.forEach(x=>{const m=xMs(x);a=Math.min(a,m);b=Math.max(b,m)});
  if(a===Infinity)return range(0);a=new Date(a);b=new Date(b);return[+new Date(a.getFullYear(),a.getMonth(),1),+new Date(b.getFullYear(),b.getMonth()+1,1)]}
 return range(o)}
const rLabel=r=>{const f=x=>new Date(x).toLocaleDateString([],{month:'short',day:'numeric'});return f(r[0])+' – '+f(r[1]-864e5)};

/* ---------- views ---------- */
const TABS=[['timer','Timer','⏱'],['cal','Calendar','📅'],['log','Log','☰'],['inv','Invoices','🧾'],['cli','Clients','👥'],['sum','Summary','📊'],['set','Settings','⚙']];
function applyTheme(){const t=S.settings.theme,h=document.documentElement;if(t==='light'||t==='dark')h.dataset.theme=t;else delete h.dataset.theme;
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(h).getPropertyValue('--acc').trim()||'#f2a900';
 if(NA&&NA.bars){const c=getComputedStyle(h),bg=c.getPropertyValue('--bg').trim();NA.bars(bg,c.getPropertyValue('--card').trim(),bg==='#11161c')}}
function render(){applyTheme();
 $('#nav').innerHTML=TABS.map(t=>`<button data-a="tab" data-v="${t[0]}" class="${tab===t[0]?'on':''}"><span>${t[2]}</span>${t[1]}</button>`).join('');
 $('#main').innerHTML=({timer:vTimer,cal:vCal,log:vLog,inv:vInv,cli:vCli,sum:vSum,set:vSet})[tab]();
}
// Project <option>s. Archived projects are left out unless one is the current value, or all is set (filters).

// Opens a draft invoice for uninvoiced entries L (oldest first) and billable expenses X, all belonging to client cl (or none).
// Invoice lines made from the log carry where they came from: e (entry id) + k ('r' regular / 'o' overtime), or x (expense id).
// ad is the description the app wrote, so a description the user reworded is left alone. man marks amounts typed by hand.
const eDesc=e=>dStr(e.start)+', '+(jobOf(e.jobId)||{name:'Work'}).name+(e.note?': '+e.note:'');

 if(c.r>0)o.r={d,ad:d,q:+(c.r/60).toFixed(2),r:j.rate,e:e.id,k:'r'};
 if(c.o>0)o.o={d:d+' (overtime)',ad:d+' (overtime)',q:+(c.o/60).toFixed(2),r:+(j.rate*S.settings.otMult).toFixed(2),e:e.id,k:'o'};return o}

 IV={id:uid(),num:b.prefix+String(b.next).padStart(3,'0'),date:dayKey(Date.now()),due:dayKey(+due),clientId:cl?cl.id:null,client:cl?cl.name:'',email:cl?cl.email:'',addr:cl?cl.addr:'',notes:b.pay||'',tax:b.tax,status:'draft',items,eids:L.map(e=>e.id),xids:X.map(x=>x.id),pics:[...L,...X].some(e=>(e.photos||[]).length>0),lk:1,isNew:true};

// Rewrites the log-made lines of every DRAFT invoice from the current entries and expenses (hours, rate, overtime split,
// wording). Sent and paid invoices are never touched. Lines typed or changed by hand are kept. Returns the changed invoice numbers.
function syncDrafts(){
 const dr=S.invoices.filter(i=>i.status==='draft');if(!dr.length)return[];
 const C=calc(S.entries),ch=[];
 dr.forEach(iv=>{const was=JSON.stringify([iv.items,iv.eids,iv.xids]);
  if(!iv.lk){ // made before lines were linked: tie them to their entries by the text they were created with
   (iv.eids||[]).forEach(id=>{const e=S.entries.find(x=>x.id===id);if(!e)return;const d=eDesc(e);
    iv.items.forEach(i=>{if(i.e||i.x)return;if(i.d===d){i.e=id;i.k='r';i.ad=d}else if(i.d===d+' (overtime)'){i.e=id;i.k='o';i.ad=i.d}})});
   (iv.xids||[]).forEach(id=>{const x=S.expenses.find(y=>y.id===id);if(!x)return;const d=xDesc(x),i=iv.items.find(i=>!i.e&&!i.x&&i.d===d);if(i){i.x=id;i.ad=d}});
   iv.lk=1}
  const out=[],done=new Set();
  // i: the line as it is (or none), w: the line as the log now says (or none)
  const put=(i,w)=>{if(i&&i.man){out.push(i);return}if(!w)return;if(!i){out.push(w);return}
   if(i.d===i.ad)i.d=w.d;i.ad=w.ad;i.q=w.q;i.r=w.r;out.push(i)};
  const loose=i=>{if(i.man){delete i.e;delete i.k;delete i.x;out.push(i)}}; // its entry is gone: keep only hand-set lines
  iv.items.forEach(i=>{
   if(i.e){if(done.has(i.e))return;done.add(i.e);
    const e=S.entries.find(x=>x.id===i.e&&x.inv===iv.id),cur={r:iv.items.find(x=>x.e===i.e&&x.k==='r'),o:iv.items.find(x=>x.e===i.e&&x.k==='o')};
    if(!e){if(cur.r)loose(cur.r);if(cur.o)loose(cur.o);return}
    const w=eLines(e,C[e.id]);put(cur.r,w.r);put(cur.o,w.o)}
   else if(i.x){const x=S.expenses.find(y=>y.id===i.x&&y.inv===iv.id);if(!x)loose(i);else put(i,xLine(x))}
   else out.push(i)});
  iv.items=out;
  iv.eids=(iv.eids||[]).filter(id=>S.entries.some(e=>e.id===id&&e.inv===iv.id));
  iv.xids=(iv.xids||[]).filter(id=>S.expenses.some(x=>x.id===id&&x.inv===iv.id));
  if(JSON.stringify([iv.items,iv.eids,iv.xids])!==was)ch.push(iv.num)});
 return ch}

function nearAddr(p){let best='',bd=150;S.entries.forEach(e=>{const l=e.loc;if(l&&l.addr&&l.lat!=null){const d=dist(p,l);if(d<=bd){bd=d;best=l.addr}}});return best}

async function lookup(p){if(!S.settings.addr)return'';
 try{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000),r=await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&lat='+p.lat+'&lon='+p.lng,{signal:c.signal,headers:{Accept:'application/json'}});clearTimeout(t);

 S.settings[k]=(t.type==='number'||t.dataset.n)?(parseFloat(t.value)||0):t.value;save();render();synSay()});

 else if(t.dataset.dn){const v=t.value.trim();if(v)S.dayNotes[t.dataset.dn]=v;else delete S.dayNotes[t.dataset.dn];store()}});
